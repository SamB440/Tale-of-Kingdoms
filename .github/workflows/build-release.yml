name: build-release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
      - name: Publish Fabric to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: AEWkDOWi
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 413354
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Only the real release jar: exclude dev / dev-shadow / shadow / sources / all jars.
          files: fabric/build/libs/!(*-@(dev|dev-shadow|shadow|sources|all)).jar
          version-type: release
          loaders: fabric
          version-resolver: exact
      - name: Publish NeoForge to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: AEWkDOWi
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 413354
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # Only the real release jar: exclude dev / dev-shadow / shadow / sources / all jars.
          files: neoforge/build/libs/!(*-@(dev|dev-shadow|shadow|sources|all)).jar
          version-type: release
          loaders: neoforge
          version-resolver: exact
