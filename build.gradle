plugins {
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
    id "com.gradleup.shadow" version "8.3.5" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    // NOTE: minecraft / neoForge / mappings are declared per-module (see common|fabric|neoforge
    // build.gradle). They must NOT live in this shared block: declaring the vanilla `minecraft`
    // dependency here would lock the NeoForge module to the vanilla platform before its
    // architectury.neoForge() call runs, so Loom would never register the `neoForge` method.
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        maven { url "https://maven.shedaniel.me/" }              // Cloth Config
        maven { url "https://maven.wispforest.io/releases" }     // oωo (Fabric)
        maven { url "https://maven.parchmentmc.org" }            // Parchment
        maven { url "https://maven.neoforged.net/releases" }     // NeoForge
        maven { url "https://maven.architectury.dev/" }          // Architectury API
        maven {
            // Modrinth mirror: ModMenu + the oωo NeoForge community fork.
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven { url "https://maven.su5ed.dev/releases" }         // Sinytra (Forgified Fabric API — owo NeoForge dev runtime)
        maven { url "https://jitpack.io" }
        mavenLocal()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }

    java {
        // Loom attaches sourcesJar to the build automatically when present.
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}
