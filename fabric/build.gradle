plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Pre-computed outside the run-config closure (rootProject.file(...) does not resolve against the
// RunConfigSettings delegate).
def datagenOutputDir = rootProject.file("common/src/main/generated")
def datagenModid = rootProject.findProperty("modid")

loom {
    runs {
        // Fabric-only data generation, run manually (`./gradlew runDatagen`) when the datagen
        // providers change. Writes into common/src/main/generated, which is committed and shipped
        // as common resources (see common/build.gradle) — the build no longer triggers this task.
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=" + datagenOutputDir
            vmArg "-Dfabric-api.datagen.modid=" + datagenModid
            runDir "build/datagen"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    // oωo (Fabric build) + its annotation processor + JiJ sentinel.
    annotationProcessor modImplementation("io.wispforest:owo-lib:${rootProject.owo_fabric_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("io.wispforest:owo-sentinel:${rootProject.owo_fabric_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Config screen hook (Fabric only).
    modImplementation "maven.modrinth:modmenu:${rootProject.modmenu_version}"

    // Dev-only compatibility-testing mods: loaded by runClient, never compiled against and never
    // shipped. The Modrinth maven publishes no transitive metadata, so BOP's required deps
    // (TerraBlender + GlitchCore) are declared explicitly. BOP/TerraBlender/GlitchCore reuse the
    // same version number for their fabric and neoforge jars, so those use Modrinth version IDs.
    // Create has no 1.21.1 Fabric build — test Create compat via the neoforge module.
    // Sodium pinned to 0.6.x: the 0.8.x jars are built with Loom 1.16 using static mixin remapping,
    // which arch-loom 1.11 refuses to consume ("Mod was built with a newer version of Loom").
    modLocalRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
    modLocalRuntime "maven.modrinth:lithium:mc1.21.1-0.15.4-fabric"
    // WorldEdit ships one multi-loader "worldedit-mod" jar (fabric + neoforge in the same file) with
    // its libraries shaded in rather than JiJ'd, so the version number resolves unambiguously and
    // nothing is stripped in dev.
    modLocalRuntime "maven.modrinth:worldedit:7.3.8"
    modLocalRuntime "maven.modrinth:biomes-o-plenty:fhyqphwv"                  // 21.1.0.14
    modLocalRuntime "maven.modrinth:terrablender:XNtIBXyQ"                     // 4.1.0.8 — BOP dep
    modLocalRuntime "maven.modrinth:glitchcore:sux8kYHe"                       // 2.1.0.2 — BOP dep
    // TerraBlender/GlitchCore JiJ night-config and typetools, but Loom strips nested jars from mod
    // dependencies in dev (crash: NoClassDefFoundError com.electronwill…/net.jodah…), so they are
    // supplied on the dev runtime classpath explicitly. Versions match the stripped nested jars.
    localRuntime "com.electronwill.night-config:core:3.6.7"
    localRuntime "com.electronwill.night-config:toml:3.6.7"
    localRuntime "net.jodah:typetools:0.6.3"
    // Pinned to 3.2.2: 3.3.x replaced its access widener with a `classTweaker` (unparseable by
    // Loom 1.11's transitive-AW scan) and 3.2.3+ are built with Loom 1.13 static mixin remapping
    // (rejected by the same "newer version of Loom" check as sodium above).
    modLocalRuntime "maven.modrinth:farmers-delight-refabricated:1.21.1-3.2.2"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}

jar {
    archiveClassifier = "dev"
}
