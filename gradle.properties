org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3G
# Loom needs to be told which module is which loader; disable the default single-loader behaviour warnings.
org.gradle.daemon=true

# ==========================================================================
# Architectury multi-loader build (Fabric + NeoForge)
# ==========================================================================
enabled_platforms=fabric,neoforge

# Minecraft + mappings
minecraft_version=1.21.1
# Parchment (parameter names + javadocs layered on official Mojang mappings)
parchment_version=2024.11.17

# Architectury toolchain
architectury_plugin_version=3.4-SNAPSHOT
architectury_loom_version=1.11-SNAPSHOT
architectury_api_version=13.0.8

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.116.13+1.21.1

# NeoForge
neoforge_version=21.1.236

# Mod Properties
mod_version=1.0.6
maven_group=com.convallyria
archives_base_name=taleofkingdoms
modid=taleofkingdoms

# Dependencies
# ModMenu is Fabric-only (config screen hook); NeoForge uses cloth-config's own screen registration.
modmenu_version=11.0.4
# Cloth Config ships a per-loader artifact (-fabric / -neoforge) sharing the same version.
cloth_version=15.0.140
# oωo: the standard release is Fabric-only (wispforest maven). The NeoForge port is a
# community fork published only to Modrinth, so the neoforge module pulls it from the
# Modrinth maven under a different version string.
owo_fabric_version=0.12.15+1.21
owo_neoforge_version=0.12.15.5-beta.1+1.21
toml4j_version=0.7.2
