plugins {
    id "com.gradleup.shadow"
}

architectury {
    // Loom's platform is selected via the module's gradle.properties (loom.platform=neoforge).
    platformSetupLoomIde()
    // Wires the Architectury dev-runtime transformer for runClient/runServer: transforms the
    // :common jar (from the developmentNeoForge configuration) at launch — generating a fake FML
    // mod for it (which is what makes the common mixin configs readable) and rewriting Fabric
    // environment classes (EnvType -> Dist) in common bytecode. Without this, dev runs fail with
    // "taleofkingdoms.mixins.json was invalid or could not be read" and later
    // ClassNotFoundException: net.fabricmc.api.EnvType. Does NOT switch Loom's platform.
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Loom's NeoForge mode needs BOTH the base Minecraft jar and the neoForge patches declared.
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
    }

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    // oωo NeoForge community fork (Modrinth-only) + Cloth Config NeoForge build, both JiJ'd.
    modImplementation "maven.modrinth:owo-lib:${rootProject.owo_neoforge_version}"
    include "maven.modrinth:owo-lib:${rootProject.owo_neoforge_version}"

    // owo's NeoForge jar JiJs these (endec + Sinytra's forgified fabric-api-base), but Loom strips
    // nested jars from mod dependencies in dev and the Modrinth maven publishes no transitives, so
    // dev runs crash with ClassNotFoundException (io.wispforest.endec.*, net.fabricmc.fabric.api.event.Event)
    // unless they are supplied explicitly. Dev-runtime only — production jars get them JiJ'd inside owo.
    // Versions must match owo's META-INF/jarjar/metadata.json.
    forgeRuntimeLibrary "io.wispforest:endec:0.1.8.1"
    forgeRuntimeLibrary "io.wispforest.endec:gson:0.1.5.1"
    forgeRuntimeLibrary "io.wispforest.endec:jankson:0.1.5.1"
    forgeRuntimeLibrary "io.wispforest.endec:netty:0.1.4.1"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.2"
    modLocalRuntime "org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308dedd1"

    modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_version}"
    include "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_version}"

    // Dev-only compatibility-testing mods (see fabric/build.gradle for the Modrinth maven caveats;
    // Modrinth version IDs pin the neoforge jars where the version number is shared across loaders).
    // NO sodium here: its neoforge jar is a thin wrapper whose actual mod code is JiJ'd
    // (…-service.jar, not published standalone), so Loom's nested-jar stripping leaves a shell that
    // crashes at mixin apply (ClassNotFoundException: …Workarounds$Reference). Test sodium compat
    // via the fabric module instead.
    modLocalRuntime "maven.modrinth:lithium:mc1.21.1-0.15.4-neoforge"
    modLocalRuntime "maven.modrinth:biomes-o-plenty:BtZKRp69"                  // 21.1.0.14
    modLocalRuntime "maven.modrinth:terrablender:6e8GCrLb"                     // 4.1.0.8 — BOP dep
    modLocalRuntime "maven.modrinth:farmers-delight:1.21.1-1.3.2"
    modLocalRuntime "maven.modrinth:glitchcore:S2TfWrZR"                       // 2.1.0.2 — BOP dep
    // Create JiJs Registrate, Flywheel and Ponder — stripped by Loom in dev (same problem as the
    // owo note above), so they are supplied explicitly. Versions must match Create's
    // META-INF/jarjar/metadata.json.
    modLocalRuntime "maven.modrinth:create:6.0.10+mc1.21.1"
    modLocalRuntime "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
    modLocalRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
    modLocalRuntime "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

// Generated data (loot tables + worldgen JSON) ships as committed common resources, so it reaches
// this jar through the shadowBundle / transformProduction path like any other common resource —
// no direct dependency on :fabric:runDatagen.
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}

jar {
    archiveClassifier = "dev"
}
